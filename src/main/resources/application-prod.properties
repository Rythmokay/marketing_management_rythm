# Production (Docker / Dokploy): activated with SPRING_PROFILES_ACTIVE=prod.
# Every value comes from environment variables; nothing secret is stored in this file.

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# No database console in production
spring.h2.console.enabled=false

# Required: no fallbacks, so the app refuses to start without them
app.jwt.secret=${JWT_SECRET}
app.admin.initial-password=${APP_ADMIN_PASSWORD}
app.seed.demo-employee=false

# Behind Dokploy's proxy (HTTPS terminated there)
server.forward-headers-strategy=framework
