# Supabase PostgreSQL: activated with SPRING_PROFILES_ACTIVE=supabase (or --spring.profiles.active=supabase).
# Credentials come from the git-ignored .env.supabase file (see .env.supabase.example) or environment variables.
spring.config.import=optional:file:.env.local[.properties],optional:file:.env.supabase[.properties]

# Session pooler (IPv4, port 5432). Supabase requires SSL.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase's pooler limits connections per project; keep the pool small
spring.datasource.hikari.maximum-pool-size=5

spring.h2.console.enabled=false
