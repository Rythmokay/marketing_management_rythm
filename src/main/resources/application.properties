spring.application.name=rythm_marketing_management

# Local development: H2 file database in ./data. Production overrides this in application-prod.properties.
spring.datasource.url=jdbc:h2:file:./data/rythmmarketingdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (available at /h2-console, local only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration (the SQL dialect is detected from the database)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Port
server.port=${PORT:8080}

# Secret that signs login tokens: base64, at least 32 bytes (openssl rand -base64 48).
# The fallback is for local development only; production must set JWT_SECRET.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Accounts created only when the database has no users yet
app.admin.initial-password=${APP_ADMIN_PASSWORD:admin123}
app.seed.demo-employee=true

# Public read-only demo login, listed on the sign-in page for visitors (e.g. recruiters).
# APP_DEMO_ENABLED=false hides it from the sign-in page and stops creating it (remove an existing one on the Marketing Team page).
app.demo.enabled=${APP_DEMO_ENABLED:true}
app.demo.username=${APP_DEMO_USERNAME:demo}
app.demo.password=${APP_DEMO_PASSWORD:demo@123}

# Local secrets for bootRun (git-ignored file, optional): e.g. GEMINI_API_KEY=...
spring.config.import=optional:file:.env.local[.properties]

# Gemini (finds influencers' review videos). Without a key the "Find review" button explains it isn't set up.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
